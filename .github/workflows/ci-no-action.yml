name: Hand-Rolled CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: handrolled - ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Exercise 1-4"
  
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "Exercise 2, 5 and 9"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - run: echo "Exercise 10 goes here"
    