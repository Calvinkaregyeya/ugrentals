name: Hand-Rolled CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: handrolled - ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Exercise 1-4
        run: echo "Exercise 1-4 to be covered in this Job"
      - name: What the runner starts with?
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME on $GITHUB_REF"
          git --version && node --version && docker --version && jq --version
      - name: Checkout commit that triggered this run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git init --quiet .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git log --oneline -1
          ls -la
      - name: Install the node version specified in the .nvmrc file
        uses: ./.github/actions/setup-node
        with:
          version-file: .nvmrc

      - name: Print the node version to verify that it is correctly installed
        run: node --version && npm --version

      - name: Install dependencies exactly as specified in package-lock.json
        run: npm ci
      
      - name: Fail on know high-severity vulnerabilities
        run: npm audit --audit-level=high
      
      - name: Run tests with node test runner
        run: npm run test:node

      - name: Run tests with Vitest test runner
        run: npm run test:vitest
          
  
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
    steps:
      - name: Exercise 2, 5 and 9
        run: echo "Exercise 2, 5 and 9 to be covered in this Job"
      - name: Checkout commit that triggered this run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git init --quiet .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git log --oneline -1
          ls -la
      - name: Decide Image name and tag
        id: meta
        run: |
          set -u
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Will build and push image: ${IMAGE}:${tag}"

      - name: Build the Docker image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -u
          docker build -t "$IMAGE:$TAG" .
      
      - name: Gate on image size
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          LIMIT_MB: 300
        run: |
          set -u
          BYTES="$(docker image inspect "$IMAGE:$TAG" --format '{{.Size}}')"
          MB=$(( BYTES / 1024 /1024 ))
          echo "### Image size: ${MB} MB (limit: ${LIMIT_MB} MB)" >> "$GITHUB_STEP_SUMMARY"
          test "$MB" -le "$LIMIT_MB"

      - name: Smoke test the container
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run --detach --rm --publish 3000:3000 --name smoke "$IMAGE:$TAG"
          trap 'docker stop smoke > /dev/null' EXIT
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error http://localhost:3000/api; then
              exit 0
            fi
            sleep 1
          done
          echo "Server never answered. Container logs:"
          docker logs smoke
          exit 1
      
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker logout ghcr.io

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./github/workflows/deploy.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

    