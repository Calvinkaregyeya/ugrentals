name: Hand-Rolled CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: handrolled - ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Exercise 1-4
        run: echo "Exercise 1-4 to be covered in this Job"
      - name: What the runner starts with?
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME on $GITHUB_REF"
          git --version && node --version && docker --version && jq --version
      - name: Checkout commit that triggered this run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git init --quiet .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git log --oneline -1
          ls -la
      - name: Install the node version specified in the .nvmrc file
        run: |
          set -u
          MAJOR="$(tr -d 'v[:space:]' < .nvmrc)"
          VERSION="$(curl -fsSL "https://nodejs.org/dist/index.json" \
            | jq -r --arg m "$MAJOR" '[.[] | select(.version | startswith("v" + $m + "."))][0].version')"
          curl -fsSL "https://nodejs.org/dist/${VERSION}/node-${VERSION}-linux-x64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${VERSION}-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Print the node version to verify that it is correctly installed
        run: node --version && npm --version
          
  
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Exercise 2, 5 and 9
        run: echo "Exercise 2, 5 and 9 to be covered in this Job"
      - name: Checkout commit that triggered this run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git init --quiet .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git log --oneline -1
          ls -la
      - name: Install the node version specified in the .nvmrc file
        run: |
          set -u
          

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - run: echo "Exercise 10 goes here"
    