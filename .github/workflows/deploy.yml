name: Deploy

on: 
  workflow_call:
    inputs:
      image:
        description: ghcr.io/calvinkaregyeya/ugrentals:latest
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: ghcr.io/calvinkaregyeya/ugrentals:latest
        required: true
        type: string
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      IMAGE: ${{ inputs.image }}

    steps:
      - name: DEPLOY over SSH
        env:
          ENV_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -u
          umask 077
          echo "$EC2-SSH_KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new " "ec2-user@${EC2_HOST}" "IMAGE='${IMAGE}' bash -s" <<'REMOTE'
          set -e
          docker pull "$IMAGE"
          dcoker stop api 2>/dev/null || true
          docker rm api 2>/dev/null || true
          dcoker run -d --name ugrental-api --restart unless-stopped -p 80:3000 "$IMAGE"
          dockerimage prune -f
          REMOTE
          rm -f key.pem