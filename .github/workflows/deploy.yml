name: Deploy

on: 
  workflow_call:
    inputs:
      image:
        description: ghcr.io/calvinkaregyeya/ugrentals:latest
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: ghcr.io/calvinkaregyeya/ugrentals:latest
        required: true
        type: string
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      IMAGE: ${{ inputs.image }}

    steps:
      - name: DEPLOY over SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -u
          umask 077
          echo "$EC2_SSH_KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new "ec2-user@${EC2_HOST}" "IMAGE='${IMAGE}' bash -s" <<'REMOTE'
          set -e
          docker pull "$IMAGE"
          docker stop ugrentals-api 2>/dev/null || true
          docker rm ugrentals-api 2>/dev/null || true
          docker run -d --name ugrentals-api --restart unless-stopped -p 80:3000 "$IMAGE"
          docker image prune -f
          REMOTE
          rm -f key.pem
      - name: Check that API is running publicly
        run: |
          set -u
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error "http://${EC2_HOST}/api"; then
              echo
              echo "### Deployed \`${IMAGE}\` to http://${EC2_HOST}/api" >> "¢GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "API never answered on http://${EC2_HOST}/api"
          exit 1

